[theme]
base = "light"
primaryColor = "#FF685F"
backgroundColor = "#F5F2EB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2B2B"
borderColor = "#E4DED2"
showWidgetBorder = true
baseRadius = "10px"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
headingFont = "Rubik:https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"

[client]
toolbarMode = "minimal"
